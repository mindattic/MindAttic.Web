# Example GitHub Actions workflow for the MindAttic.Web.Shared test suite.
#
# NOT active: it lives under MindAttic.Web.Shared/tests/ on purpose. To enable it, copy it to
# .github/workflows/web-shared-tests.yml at the MindAttic.Web root after reviewing the secrets/permissions below.
#
#  * push / pull_request  -> LOCAL mode: assets + sites. The sites come from their folders in the same MindAttic.Web
#                            checkout, and the CDN is answered from the MindAttic.Web.Shared working tree, so no tag has
#                            to exist and no live site is touched.
#  * schedule / release   -> LIVE mode: the real sites + the real jsDelivr tag (cdn + sites + assets).
name: web-shared-tests

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  schedule:
    - cron: '17 6 * * *'     # daily, after the CDN edge has had time to settle
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local:
    name: Local (assets + sites)
    runs-on: ubuntu-latest
    steps:
      # One checkout holds the package and every site: MindAttic.Web.Shared/, mindattic.com/, ryandebraal.com/, ...
      # Full history + tags so the expected tag is the highest V<n> tag of MindAttic.Web.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MindAttic.Web.Shared/tests/package-lock.json
      - name: Install
        working-directory: MindAttic.Web.Shared/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Assets
        working-directory: MindAttic.Web.Shared/tests
        run: npm run test:assets
      - name: Sites (local)
        working-directory: MindAttic.Web.Shared/tests
        env: { TEST_MODE: local, PW_CHANNEL: chromium, CI: 'true' }
        run: npm run test:sites
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-local
          path: |
            MindAttic.Web.Shared/tests/playwright-report
            MindAttic.Web.Shared/tests/test-results
          if-no-files-found: ignore

  live:
    name: Live (real sites + real CDN)
    if: github.event_name == 'schedule' || github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: MindAttic.Web.Shared/tests/package-lock.json
      - name: Install
        working-directory: MindAttic.Web.Shared/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Live (assets + cdn + sites)
        working-directory: MindAttic.Web.Shared/tests
        env:
          TEST_MODE: live
          PW_CHANNEL: chromium
          CI: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # only raises the GitHub API rate limit for the tag test
          # SHARED_TAG: V12                             # set to override the expected tag
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-live
          path: |
            MindAttic.Web.Shared/tests/playwright-report
            MindAttic.Web.Shared/tests/test-results
          if-no-files-found: ignore
